buildscript {
    repositories {
        mavenLocal()
    }
    dependencies {
        classpath "com.bertramlabs.plugins:asset-pipeline-gradle:${assetPipelineVersion}"
    }
}


plugins {
    id "org.asciidoctor.jvm.convert" version "3.3.2"
    id("groovy") 
    id("com.github.johnrengelman.shadow")
    id("io.micronaut.application") version "4.0.3"
    id("io.micronaut.aot") version "4.0.3"
}

apply plugin: "asset-pipeline"

group "com.morpheusdata"

repositories {
    mavenLocal()
    mavenCentral()
}

configurations {
    // for dependencies that are needed for development only
    developmentOnly
}

dependencies {
    implementation "com.bertramlabs.plugins:asset-pipeline-micronaut:${assetPipelineVersion}"
    assets "com.bertramlabs.plugins:less-asset-pipeline:${assetPipelineVersion}"
    // MORPH-19070: override Micronaut's Netty BOM (4.1.97.Final) to cover Netty CVEs; keeps all io.netty:* aligned
    implementation(platform("io.netty:netty-bom:4.1.137.Final"))
    implementation("io.micronaut.serde:micronaut-serde-jackson")
    compileOnly("io.micronaut.serde:micronaut-serde-processor")
    constraints {
        // MORPH-19074: gson 2.5 comes transitively via asset-pipeline-micronaut -> less4j
        implementation("com.google.code.gson:gson:2.8.9")
    }
    implementation("io.micronaut.groovy:micronaut-runtime-groovy")
    // MORPH-19072: Micronaut 4.10 is built on Netty 4.2; its BOM pins 4.2.13.Final (still vulnerable), so raise to the first clean 4.2.x
    implementation(platform("io.netty:netty-bom:4.2.17.Final"))
    implementation("io.micronaut:micronaut-http-server-netty")
    constraints {
        // MORPH-19075: protobuf-java is transitive via less4j (2.5.0) and Micronaut's BOM (3.23.4)
        implementation("com.google.protobuf:protobuf-java:3.25.5")
    }
    implementation("io.micronaut:micronaut-http-client")
    constraints {
        // MORPH-19076: commons-io 2.3 comes transitively via asset-pipeline-micronaut -> less4j
        implementation("commons-io:commons-io:2.14.0")
    }
	implementation 'org.yaml:snakeyaml:1.33'
	implementation 'com.github.jknack:handlebars:4.5.2'


	// MORPH-19071: explicit version overrides the Micronaut BOM's logback 1.4.11; classic pulls matching logback-core
	runtimeOnly("ch.qos.logback:logback-classic:1.5.34")
    
    testImplementation("io.micronaut:micronaut-inject-groovy")
    testImplementation("org.junit.jupiter:junit-jupiter-api")
    testImplementation("io.micronaut.test:micronaut-test-junit5")
    testRuntimeOnly("org.junit.jupiter:junit-jupiter-engine")

}

test.classpath += configurations.developmentOnly

mainClassName = "com.morpheus.Application"

// use JUnit 5 platform
test {
    useJUnitPlatform()
}

java {
    sourceCompatibility = JavaVersion.toVersion('1.17')
    targetCompatibility = JavaVersion.toVersion('1.17')
}

tasks.withType(GroovyCompile) {
    groovyOptions.forkOptions.jvmArgs.add('-Dgroovy.parameters=true')
}

shadowJar {
    mergeServiceFiles()
}



assets {
	// developmentRuntime = false
	from "${project.projectDir}/src/assets"
	// from 'morpheus-plugin-site/src/assets'
	excludes = ["**/*.less"]
	includes = ['application.less']
}


micronaut {
    runtime("netty")
    testRuntime("spock2")
    processing {
        incremental(true)
        annotations("test.mn.*")
    }
    aot {
    // Please review carefully the optimizations enabled below
    // Check https://micronaut-projects.github.io/micronaut-aot/latest/guide/ for more details
        optimizeServiceLoading = false
        convertYamlToJava = false
        precomputeOperations = true
        cacheEnvironment = true
        optimizeClassLoading = true
        deduceEnvironment = true
        optimizeNetty = true
    }
}


task copyManual(type: Copy, dependsOn: [':morpheus-plugin-docs:asciidoctor', ':morpheus-plugin-site:inspectRuntimeClasspath']) {
    from new File(project(':morpheus-plugin-docs').buildDir,'/docs')
    into 'src/main/resources/'
}

task copyApiDoc(type: Copy, dependsOn: [':morpheus-plugin-api:javadoc', ':morpheus-plugin-site:inspectRuntimeClasspath']) {
    from new File(project(':morpheus-plugin-api').buildDir,'/docs')
    into 'src/main/resources/'
}


[ tasks.run].each { runTask ->
    configure(runTask) {
        systemProperties System.properties
    }
}

tasks.shadowJar.dependsOn assetCompile
tasks.assetCompile.dependsOn processResources
tasks.processResources.dependsOn copyManual
tasks.processResources.dependsOn copyApiDoc
tasks.assetCompile.dependsOn copyManual
